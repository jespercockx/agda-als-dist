name: Build WASM

# Compiles the Agda Language Server for WASI from the revisions pinned in
# config/version.env and stores the result in the Actions cache, keyed on the
# WASM build inputs. build-artifacts.yml restores the same cache, so the
# hour-long compile runs once per set of inputs instead of once per release.
#
# This is the expensive workflow: it compiles Agda from source. On `main` it
# therefore runs only when a *WASM* build input actually changes — the pinned
# versions in config/version.env, the WASM build script, the cross-compile patch,
# or this workflow. It can always be run by hand with "Run workflow". Nothing is
# published here; releasing is build-artifacts.yml.

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "config/version.env"
      - "patches/**"
      - "scripts/build-als-wasm.sh"
      - ".github/workflows/build-wasm.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version configuration
        id: version
        run: |
          set -euo pipefail
          source config/version.env
          {
            echo "flavour=${GHC_WASM_META_FLAVOUR}"
            echo "ghc_wasm_meta_revision=${GHC_WASM_META_REVISION}"
            echo "agda_version=${AGDA_VERSION}"
            echo "als_wasm_name=${ALS_WASM_NAME}"
          } >> "$GITHUB_OUTPUT"

      # The key must stay identical to build-artifacts.yml's so a release run can
      # restore what this run saved.
      - name: Restore the cached WASM
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.version.outputs.als_wasm_name }}.wasm
            ${{ steps.version.outputs.als_wasm_name }}.wasm.gz
          key: als-wasm-${{ hashFiles('config/version.env', 'patches/**', 'scripts/build-als-wasm.sh') }}

      - name: Install host build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl git jq unzip zstd zip \
            autoconf automake libtool alex happy

      - name: Install pinned ghc-wasm-meta toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://gitlab.haskell.org/ghc/ghc-wasm-meta.git "$RUNNER_TEMP/ghc-wasm-meta"
          git -C "$RUNNER_TEMP/ghc-wasm-meta" fetch --depth=1 origin "${{ steps.version.outputs.ghc_wasm_meta_revision }}"
          git -C "$RUNNER_TEMP/ghc-wasm-meta" checkout --detach FETCH_HEAD
          FLAVOUR="${{ steps.version.outputs.flavour }}" PREFIX="$HOME/.ghc-wasm" \
            "$RUNNER_TEMP/ghc-wasm-meta/setup.sh"
          "$HOME/.ghc-wasm/add_to_github_path.sh"

      - name: Build ALS for WASI
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          source "$HOME/.ghc-wasm/env"
          ./scripts/build-als-wasm.sh

      - name: Verify the built wasm reports its version
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          source "$HOME/.ghc-wasm/env"
          wasmtime run -C cache=n -C compiler=cranelift -C parallel-compilation=n \
            -O opt-level=0 --env PATH= -- "${{ steps.version.outputs.als_wasm_name }}.wasm" --version

      - name: Cache the built WASM
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.version.outputs.als_wasm_name }}.wasm
            ${{ steps.version.outputs.als_wasm_name }}.wasm.gz
          key: als-wasm-${{ hashFiles('config/version.env', 'patches/**', 'scripts/build-als-wasm.sh') }}
