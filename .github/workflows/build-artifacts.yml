name: Build artifacts

# Builds the full set of runtime artifacts for a version tag, verifies them
# against dist-manifest.json, and publishes them as a GitHub release in the same
# run — nothing is handed off through a workflow artifact.
#
# The WASM compile is restored from the cache that build-wasm.yml fills, keyed on
# the WASM build inputs. Rebuilding the compiler when the cache is cold is the
# fallback, not the default, so changes to the cheap scripts can be iterated on
# without an hour-long recompile.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release, e.g. v2.8.0-als-e6541f8"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version configuration
        id: version
        run: |
          set -euo pipefail
          source config/version.env
          {
            echo "agda_version=${AGDA_VERSION}"
            echo "wasm_name=${ALS_WASM_NAME}"
            echo "ghc_wasm_meta_revision=${GHC_WASM_META_REVISION}"
            echo "ghc_wasm_meta_flavour=${GHC_WASM_META_FLAVOUR}"
          } >> "$GITHUB_OUTPUT"

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip zip xz-utils

      # Same key as build-wasm.yml, so a tag restores what a `main` run saved. A
      # `main` run's cache lives in the default-branch scope, which every ref can
      # read; the tag itself never writes one.
      - name: Restore the cached WASM
        id: wasm
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.version.outputs.wasm_name }}.wasm
            ${{ steps.version.outputs.wasm_name }}.wasm.gz
          key: als-wasm-${{ hashFiles('config/version.env', 'patches/**', 'scripts/build-als-wasm.sh') }}

      - name: Install pinned ghc-wasm-meta toolchain
        if: steps.wasm.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get install -y \
            build-essential git zstd autoconf automake libtool alex happy
          git clone --filter=blob:none https://gitlab.haskell.org/ghc/ghc-wasm-meta.git "$RUNNER_TEMP/ghc-wasm-meta"
          git -C "$RUNNER_TEMP/ghc-wasm-meta" fetch --depth=1 origin "${{ steps.version.outputs.ghc_wasm_meta_revision }}"
          git -C "$RUNNER_TEMP/ghc-wasm-meta" checkout --detach FETCH_HEAD
          FLAVOUR="${{ steps.version.outputs.ghc_wasm_meta_flavour }}" PREFIX="$HOME/.ghc-wasm" \
            "$RUNNER_TEMP/ghc-wasm-meta/setup.sh"
          "$HOME/.ghc-wasm/add_to_github_path.sh"

      - name: Build ALS for WASI
        if: steps.wasm.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          source "$HOME/.ghc-wasm/env"
          ./scripts/build-als-wasm.sh

      - name: Verify the built wasm reports its version
        if: steps.wasm.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          source "$HOME/.ghc-wasm/env"
          wasmtime run -C cache=n -C compiler=cranelift -C parallel-compilation=n \
            -O opt-level=0 --env PATH= -- "${{ steps.version.outputs.wasm_name }}.wasm" --version

      - name: Fetch standard library archive
        run: ./scripts/fetch-stdlib-archive.sh

      - name: Build primitive data archive
        run: ./scripts/build-data-archive.sh

      - name: Build standard-library interfaces
        run: ./scripts/build-stdlib-interfaces.sh

      - name: Regenerate dist-manifest.json
        run: node scripts/compute-manifest.mjs

      - name: Verify artifacts against the manifest
        run: node scripts/verify-artifacts.mjs

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          AGDA_VERSION: ${{ steps.version.outputs.agda_version }}
          WASM_NAME: ${{ steps.version.outputs.wasm_name }}
        run: |
          set -euo pipefail
          assets=(
            "${WASM_NAME}.wasm"
            "${WASM_NAME}.wasm.gz"
            agda-data.zip
            agda-stdlib-*.zip
            "interfaces-${AGDA_VERSION}.zip"
            dist-manifest.json
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Agda ${AGDA_VERSION} (${TAG})" \
              --generate-notes
          fi
